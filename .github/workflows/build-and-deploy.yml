name: Build and Push to ACR

on:
    push:
        branches:
            - main

env:
    REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
    ACR_NAME: roboshoprc

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service:
                    - frontend
                    - cart
                    - payment
                    - user
                    - catalogue
                    - shipping
                    - debug
                    - mongodb
                    - mysql
                    - redis
                    - rabbitmq

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Login to ACR
              uses: azure/docker-login@v1
              with:
                  login-server: ${{ secrets.ACR_LOGIN_SERVER }}
                  username: ${{ secrets.AZURE_CLIENT_ID }}
                  password: ${{ secrets.AZURE_CLIENT_SECRET }}

            - name: Build Docker image for ${{ matrix.service }}
              run: |
                  docker build \
                    -t ${{ env.REGISTRY }}/${{ env.ACR_NAME }}-${{ matrix.service }}:${{ github.sha }} \
                    -t ${{ env.REGISTRY }}/${{ env.ACR_NAME }}-${{ matrix.service }}:latest \
                    ./${{ matrix.service }}/

            - name: Trivy Scan - OS Vulnerabilities
              run: |
                  echo "🔍 Scanning ${{ matrix.service }} for OS vulnerabilities..."
                  trivy image \
                    --scanners vuln \
                    --pkg-types os \
                    --severity MEDIUM,HIGH,CRITICAL \
                    --format table \
                    --output trivy-os-${{ matrix.service }}.txt \
                    --exit-code 0 \
                    ${{ env.REGISTRY }}/${{ env.ACR_NAME }}-${{ matrix.service }}:${{ github.sha }}
                  cat trivy-os-${{ matrix.service }}.txt

            - name: Trivy Scan - App Dependencies
              run: |
                  echo "🔍 Scanning ${{ matrix.service }} for dependency vulnerabilities..."
                  trivy image \
                    --scanners vuln \
                    --pkg-types library \
                    --severity MEDIUM,HIGH,CRITICAL \
                    --format table \
                    --output trivy-app-${{ matrix.service }}.txt \
                    --exit-code 0 \
                    ${{ env.REGISTRY }}/${{ env.ACR_NAME }}-${{ matrix.service }}:${{ github.sha }}
                  cat trivy-app-${{ matrix.service }}.txt

            - name: Trivy Scan - Secrets Detection
              run: |
                  echo "🔐 Scanning ${{ matrix.service }} for exposed secrets..."
                  trivy image \
                    --scanners secret \
                    --severity HIGH,CRITICAL \
                    --format table \
                    --output trivy-secrets-${{ matrix.service }}.txt \
                    --exit-code 0 \
                    ${{ env.REGISTRY }}/${{ env.ACR_NAME }}-${{ matrix.service }}:${{ github.sha }}
                  cat trivy-secrets-${{ matrix.service }}.txt

            - name: Trivy Scan - Critical Check
              run: |
                  echo "🚨 Checking for CRITICAL vulnerabilities..."
                  trivy image \
                    --scanners vuln \
                    --severity CRITICAL \
                    --exit-code 1 \
                    --timeout 10m \
                    ${{ env.REGISTRY }}/${{ env.ACR_NAME }}-${{ matrix.service }}:${{ github.sha }} || {
                    echo "❌ CRITICAL vulnerabilities found"
                    exit 1
                  }
                  echo "✅ No CRITICAL vulnerabilities found"

            - name: Upload Trivy Reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: trivy-reports-${{ matrix.service }}
                  path: trivy-*.txt
                  retention-days: 30

            - name: Push image to ACR
              run: |
                  docker push ${{ env.REGISTRY }}/${{ env.ACR_NAME }}-${{ matrix.service }}:${{ github.sha }}
                  docker push ${{ env.REGISTRY }}/${{ env.ACR_NAME }}-${{ matrix.service }}:latest
                  echo "✅ Pushed: ${{ env.REGISTRY }}/${{ env.ACR_NAME }}-${{ matrix.service }}:${{ github.sha }}"

            - name: Cleanup
              if: always()
              run: |
                  docker logout ${{ env.REGISTRY }} || true
                  rm -f trivy-*.txt
